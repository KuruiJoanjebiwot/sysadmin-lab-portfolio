---
- name: Base Linux System Configuration
  hosts: linux
  become: true
  tasks:
    - name: Ensure common administrative utilities are installed
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
        state: present
        update_cache: true

- name: Base Windows Configuration
  hosts: windows
  tasks:
    - name: Ensure RSAT Active Directory tools are installed
      ansible.windows.win_feature:
        name: RSAT-AD-Tools
        state: present
